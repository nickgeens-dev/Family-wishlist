<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Familie-verlanglijstje</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-in">
        <div class="deco" aria-hidden="true">🎁 ⭐ 🎄</div>
        <h1>Familie-verlanglijstje</h1>
        <p class="sub">
          Sinterklaas en Kerstmis. Zet een wens op de lijst en vink hem af als
          hij gekocht is.
        </p>
        <div class="chips" id="countdowns"></div>
        <button class="share" id="share" type="button">
          Kopieer de link om met de familie te delen
        </button>
      </div>
      <svg
        class="wave"
        viewBox="0 0 1440 40"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          d="M0 20 Q 120 0 240 20 T 480 20 T 720 20 T 960 20 T 1200 20 T 1440 20 V40 H0 Z"
        />
      </svg>
    </header>

    <main class="wrap">
      <div class="notice" id="notice" hidden></div>

      <section class="panel">
        <label class="inline" for="me">
          <span>Jouw naam</span>
          <input
            type="text"
            id="me"
            placeholder="Komt te staan bij wat je koopt"
            maxlength="30"
            autocomplete="given-name"
          />
        </label>
      </section>

      <section class="panel" id="addpanel">
        <h2>Wens toevoegen</h2>
        <div class="grid2">
          <div>
            <label class="lbl" for="who">Voor wie is het?</label>
            <input
              type="text"
              id="who"
              placeholder="bv. Emma"
              maxlength="30"
              autocomplete="off"
            />
          </div>
          <div>
            <label class="lbl" for="occ">Gelegenheid</label>
            <select id="occ">
              <option value="both">Allebei</option>
              <option value="sint">Sinterklaas</option>
              <option value="xmas">Kerstmis</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="what">Wat zou diegene graag krijgen?</label>
          <input
            type="text"
            id="what"
            placeholder="bv. LEGO Technic-set"
            maxlength="120"
            autocomplete="off"
          />
        </div>
        <div class="field">
          <label class="lbl" for="link"
            >Link naar het product (optioneel)</label
          >
          <input
            type="text"
            id="link"
            placeholder="bv. https://www.bol.com/…"
            maxlength="500"
            autocomplete="off"
            inputmode="url"
            autocapitalize="off"
          />
        </div>
        <div class="field">
          <span class="lbl">Foto (optioneel)</span>
          <div class="photo-row">
            <input type="file" id="photo" class="sr" accept="image/*" />
            <label class="filebtn" for="photo">📷 Foto kiezen</label>
            <div id="photoPreview" class="photo-preview"></div>
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="note">Opmerking (optioneel)</label>
          <input
            type="text"
            id="note"
            placeholder="Maat, kleur, enz."
            maxlength="300"
            autocomplete="off"
          />
        </div>
        <button class="primary" id="add" type="button">
          Toevoegen aan de lijst
        </button>
      </section>

      <nav class="tabs" id="tabs" aria-label="Filter op gelegenheid"></nav>
      <div id="progress"></div>
      <div id="list"><p class="empty">De lijst wordt geladen…</p></div>

      <section class="panel backup">
        <h2>Back-up</h2>
        <p class="hint">
          Bewaar een kopie van de hele lijst op je toestel, voor het geval er
          ooit iets misgaat.
        </p>
        <div class="btnrow">
          <button type="button" class="secondary" id="export">
            Back-up downloaden
          </button>
          <input
            type="file"
            id="importFile"
            class="sr"
            accept="application/json,.json"
          />
          <label class="secondary" for="importFile">Back-up terugzetten</label>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
